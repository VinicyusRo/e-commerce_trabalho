<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - PC Store</title>
</head>
<body>
    <header id="cabecalho"></header>

    <main class="coluna-estreita">
        <h1 id="titulo">Entrar</h1>

        <form id="formulario" class="formulario">
            <label id="campo-nome" hidden>
                Nome
                <input type="text" name="nome" autocomplete="name">
            </label>
            <label>
                E-mail
                <input type="email" name="email" required autocomplete="email">
            </label>
            <label>
                Senha
                <input type="password" name="senha" required minlength="6"
                       autocomplete="current-password">
            </label>
            <p id="erro" class="sem-estoque"></p>
            <button type="submit" class="botao primario" id="btn-enviar">Entrar</button>
        </form>

        <p><a href="#" id="alternar">Não tem conta? Cadastre-se</a></p>
    </main>

    <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
