<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar compra - PC Store</title>
</head>
<body>
    <header id="cabecalho"></header>

    <main>
        <h1>Finalizar compra</h1>
        <p id="mensagem"></p>

        <section id="resumo"></section>

        <section id="enderecos">
            <h2>Endereço de entrega</h2>
            <div id="lista-enderecos"></div>

            <details id="novo-endereco">
                <summary>Cadastrar novo endereço</summary>
                <form id="form-endereco" class="formulario">
                    <label>CEP
                        <input name="cep" id="campo-cep" required inputmode="numeric"
                               maxlength="9" placeholder="00000-000" autocomplete="postal-code">
                        <small id="status-cep" class="dica-campo">Digite o CEP para preencher o endereço automaticamente.</small>
                    </label>
                    <label>Rua <input name="rua" required autocomplete="address-line1"></label>
                    <div class="linha-campos">
                        <label>Número <input name="numero" id="campo-numero" required></label>
                        <label>Estado (UF) <input name="estado" maxlength="2" required></label>
                    </div>
                    <label>Cidade <input name="cidade" required autocomplete="address-level2"></label>
                    <p id="erro-endereco" class="sem-estoque"></p>
                    <button type="submit" class="botao">Salvar endereço</button>
                </form>
            </details>
        </section>

        <p id="erro-pedido" class="sem-estoque"></p>
        <button id="btn-finalizar" class="botao primario">Confirmar pedido</button>
    </main>

    <script type="module" src="/src/pages/checkout.js"></script>
</body>
</html>
