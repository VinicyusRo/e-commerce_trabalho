<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta - PC Store</title>
</head>
<body>
    <header id="cabecalho"></header>

    <main class="conta">
        <p id="sucesso" class="aviso-sucesso"></p>
        <p id="mensagem"></p>

        <!-- Nome, e-mail e botão sair (preenchido pelo conta.js) -->
        <section id="perfil" class="perfil" hidden></section>

        <section class="conta-secao">
            <div class="secao-topo">
                <h2>Meus pedidos</h2>
            </div>
            <div id="conta-pedidos" class="lista-pedidos"></div>
        </section>

        <section class="conta-secao">
            <div class="secao-topo">
                <h2>Endereços</h2>
                <button id="btn-novo-endereco" class="botao pequeno" type="button">+ Novo endereço</button>
            </div>
            <div id="conta-enderecos" class="grade-enderecos"></div>
        </section>
    </main>

    <script type="module" src="/src/pages/conta.js"></script>
</body>
</html>
