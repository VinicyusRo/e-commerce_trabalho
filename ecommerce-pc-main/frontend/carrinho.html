<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - PC Store</title>
</head>
<body>
    <header id="cabecalho"></header>

    <main>
        <a class="botao-voltar" href="/" data-voltar>Voltar</a>
        <h1>Carrinho</h1>
        <p id="mensagem"></p>

        <!-- Itens à esquerda, "notinha" com o total à direita -->
        <div class="carrinho-layout">
            <section id="itens" class="carrinho-itens" aria-label="Itens do carrinho"></section>
            <aside id="resumo" class="nota" aria-label="Resumo do pedido"></aside>
        </div>

        <section id="secao-recomendados" class="recomendados" hidden>
            <h2>Você também pode gostar</h2>
            <div id="recomendados" class="grade"></div>
        </section>
    </main>

    <script type="module" src="/src/pages/carrinho.js"></script>
</body>
</html>
