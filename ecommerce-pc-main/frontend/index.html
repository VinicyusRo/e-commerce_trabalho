<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Store</title>
</head>
<body>
    <header id="cabecalho"></header>

    <main>
        <!-- Banner de destaque (escondido quando há busca ou filtro) -->
        <section id="destaque" class="destaque">
            <div class="destaque-texto">
                <span class="destaque-etiqueta">Prévia 3D interativa</span>
                <h1>Veja cada peça em 3D antes de comprar</h1>
                <p>Gire, aproxime e confira placas de vídeo, processadores, memórias e SSDs direto no navegador.</p>
                <div class="destaque-botoes">
                    <a class="botao primario" href="#titulo-lista">Ver produtos</a>
                    <a class="botao" href="/monte-seu-pc.html">Monte seu PC</a>
                </div>
                <ul class="destaque-vantagens">
                    <li>Visualização 3D</li>
                    <li>Estoque em tempo real</li>
                    <li>Compra segura</li>
                </ul>
            </div>
            <!-- Vitrine: produtos passando sozinhos (preenchida pelo home.js) -->
            <div id="vitrine" class="vitrine" aria-roledescription="carrossel" aria-label="Produtos em destaque" hidden>
                <div class="vitrine-janela"><div id="vitrine-trilho" class="vitrine-trilho"></div></div>
                <div id="vitrine-pontos" class="vitrine-pontos" role="tablist" aria-label="Escolher produto"></div>
            </div>
        </section>

        <nav id="categorias" class="categorias" aria-label="Categorias"></nav>

        <h2 id="titulo-lista" class="titulo-secao">Produtos</h2>
        <p id="mensagem"></p>
        <section id="produtos" class="grade" aria-labelledby="titulo-lista"></section>
    </main>

    <script type="module" src="/src/pages/home.js"></script>
</body>
</html>
